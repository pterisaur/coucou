name: Teri App Build

on:
  push:
    branches: [coucou-teri-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Debug (unsigned, no PHONE_LINK/CloudKit)
        run: |
          cd NotchBuddy
          xcodebuild \
            -project NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Debug \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Ad-hoc sign and zip the app
        run: |
          cd NotchBuddy/build/Build/Products/Debug
          codesign --force --deep --sign - \
            --entitlements "$GITHUB_WORKSPACE/NotchBuddy/Resources/Coucou.entitlements" \
            Coucou.app
          ditto -c -k --keepParent Coucou.app "$RUNNER_TEMP/Coucou.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-app
          path: ${{ runner.temp }}/Coucou.zip
          retention-days: 7
